name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0 # match package.json devDependencies
      - run: supabase start
      - run: npm run test:db
      - run: npm run env:local
      # Vitest after .env.local so the SQL/TS constants test runs instead of skipping.
      - run: npm test
      - run: npm run seed
      # Second run must insert nothing and fail on nothing (insert-only seed).
      - run: npm run seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The offline, single-user build in solo/. Static files only, so it never starts Supabase.
  solo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/solo
      - run: npm run solo:build
      # The build must hold no trace of the group app's backend.
      - run: "! grep -rli supabase solo/dist"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:solo-e2e
