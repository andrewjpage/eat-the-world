name: DB push

# Applies new migrations to the production project when they land on main.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production schema changes wait for approval: in the repo settings, give the
    # production environment Andrew as a required reviewer.
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check the secret
        id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == 'true'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: steps.gate.outputs.run == 'true'
        with:
          version: 2.119.0 # match package.json devDependencies
      - name: Push migrations
        if: steps.gate.outputs.run == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
