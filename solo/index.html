<!doctype html>
<html lang="en-GB" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- GitHub Pages cannot set headers, so these stand in for X-Robots-Tag and Referrer-Policy. The
         referrer is what OpenStreetMap's tile policy asks every client to send. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="%THEME_LIGHT%" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="%THEME_DARK%" />
    <title>%APP_NAME%</title>
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
